name: MAXPASE Validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: maxpase_test
          POSTGRES_PASSWORD: ${{ secrets.MAXPASE_CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: maxpase_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maxpase_test -d maxpase_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maxpase_test:${{ secrets.MAXPASE_CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/maxpase_ci?schema=public
      TEST_DATABASE_URL: postgresql://maxpase_test:${{ secrets.MAXPASE_CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/maxpase_ci?schema=public
      MAXPASE_CI_DATABASE_CONFIRMED: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run prisma:generate
      - run: npm run prisma:validate
      - name: Verify empty PostgreSQL baseline, repeat deploy and all safeguard triggers
        run: npm run validate:migrations
      - name: Run Startup Skool database-backed admissions acceptance
        run: npx vitest run tests/startup-admissions-postgres.test.ts --no-file-parallelism --testTimeout=120000
      - run: npm run lint
      - run: npm run typecheck
      - name: Confirm PostgreSQL 16 client binaries
        run: |
          for tool in psql pg_dump pg_restore; do
            "$tool" --version
            "$tool" --version | grep -Eq 'PostgreSQL\) 16(\.| )'
          done
      - name: Run Startup and SIA regression suite
        if: github.ref == 'refs/heads/codex/aira-startup-admissions-acceptance'
        run: npx vitest run tests/startup-*.test.ts tests/sia-*.test.ts --no-file-parallelism --testTimeout=30000
      - name: Run full PostgreSQL integration and regression suite
        if: github.ref != 'refs/heads/codex/aira-startup-admissions-acceptance'
        run: npm test
      - run: npm run build
      - name: Require reviewed registry metadata submission
        env:
          APPROVED: ${{ vars.NPM_AUDIT_APPROVED }}
        run: test "$APPROVED" = "true"
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full dependency findings
        run: npm audit --json > dependency-audit.json
        continue-on-error: true
      - name: Reject unreviewed findings
        run: npx tsx scripts/review-dependency-audit.ts dependency-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-findings
          path: dependency-audit.json
          if-no-files-found: ignore
